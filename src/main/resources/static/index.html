<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 · 大模型统一网关</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="main-shell" v-cloak>

  <!-- 侧栏（公共组件） -->
  <x-nav active="dashboard"></x-nav>

  <div class="content">
    <!-- 顶栏（公共组件） -->
    <x-head title="仪表盘"></x-head>

    <div class="body">
      <div class="page">

        <!-- 加载中 -->
        <div v-if="loading" class="page-loading">
          <div class="spinner"></div>
          正在读取今日指标…
        </div>

        <template v-else>
          <!-- 指标卡（每行 5 个） -->
          <div class="stat-grid">
            <div class="stat">
              <div class="k"><span class="stat-ico" style="background:#eef2ff;color:#6366f1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8v6M8 11h8"/></svg></span>调用总数</div>
              <div class="v">{{ dash.totalCalls != null ? fmtTokens(dash.totalCalls) : '—' }}</div>
              <div class="u">历史累计请求</div>
            </div>
            <div class="stat ok">
              <div class="k"><span class="stat-ico" style="background:#ecfdf5;color:#10b981"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>成功总数</div>
              <div class="v">{{ dash.totalSuccess != null ? fmtTokens(dash.totalSuccess) : '—' }}</div>
              <div class="u">历史累计成功</div>
            </div>
            <div class="stat bad">
              <div class="k"><span class="stat-ico" style="background:#fef2f2;color:#ef4444"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>失败总数</div>
              <div class="v">{{ dash.totalFail != null ? fmtTokens(dash.totalFail) : '—' }}</div>
              <div class="u">历史累计失败</div>
            </div>
            <div class="stat">
              <div class="k"><span class="stat-ico" style="background:#eff6ff;color:#2563eb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg></span>今日调用</div>
              <div class="v">{{ dash.todayCalls != null ? fmtTokens(dash.todayCalls) : '—' }}</div>
              <div class="u">今日请求总次数</div>
            </div>
            <div class="stat ok">
              <div class="k"><span class="stat-ico" style="background:#ecfdf5;color:#10b981"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>今日成功</div>
              <div class="v">{{ dash.todaySuccess != null ? fmtTokens(dash.todaySuccess) : '—' }}</div>
              <div class="u">状态码 200~399</div>
            </div>
            <div class="stat bad">
              <div class="k"><span class="stat-ico" style="background:#fef2f2;color:#ef4444"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>今日失败</div>
              <div class="v">{{ dash.todayFail != null ? fmtTokens(dash.todayFail) : '—' }}</div>
              <div class="u">异常请求</div>
            </div>
            <div class="stat">
              <div class="k"><span class="stat-ico" style="background:#f5f3ff;color:#8b5cf6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>输入 Token</div>
              <div class="v">{{ fmtTokens(dash.todayInputTokens) }}</div>
              <div class="u">今日提示词消耗</div>
            </div>
            <div class="stat">
              <div class="k"><span class="stat-ico" style="background:#ecfeff;color:#06b6d4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></span>输出 Token</div>
              <div class="v">{{ fmtTokens(dash.todayOutputTokens) }}</div>
              <div class="u">今日生成内容消耗</div>
            </div>
            <div class="stat">
              <div class="k"><span class="stat-ico" style="background:#eff6ff;color:#2563eb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M15 8l2.5 2.5M17 6l2 2"/></svg></span>启用 API Key</div>
              <div class="v">{{ dash.enabledChannels != null ? dash.enabledChannels : '—' }}</div>
              <div class="u">对外开放的客户 Key</div>
            </div>
            <div class="stat">
              <div class="k"><span class="stat-ico" style="background:#eef2ff;color:#6366f1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="7" rx="2"/><rect x="5" y="14" width="14" height="7" rx="2"/><path d="M9 6.5h.01M9 17.5h.01"/></svg></span>启用渠道</div>
              <div class="v">{{ dash.enabledProviders != null ? dash.enabledProviders : '—' }}</div>
              <div class="u">已接入的上游</div>
            </div>
          </div>

          <!-- 客户用量 Top5 -->
          <div class="panel">
            <div class="panel-head">
              <span class="panel-title"><span class="dot-mark"></span>客户用量 Top5<span class="sub">今日累计</span></span>
            </div>
            <div class="panel-body">
              <div v-if="custLoading" class="page-loading" style="min-height:80px"><div class="spinner"></div>&nbsp;加载中…</div>
              <div v-else-if="custStats.length === 0" class="model-dist"><div class="empty-tip">暂无调用数据</div></div>
              <div v-else class="cust-table">
                <table class="tbl cust-tbl">
                  <thead>
                    <tr>
                      <th style="width:44px">#</th>
                      <th>客户名称</th>
                      <th>调用次数</th>
                      <th>输入 Token</th>
                      <th>输出 Token</th>
                      <th>合计 Token</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="(c, i) in custStats" :key="c.customerName">
                      <td><span class="cust-rank">{{ i + 1 }}</span></td>
                      <td class="cust-name">{{ c.customerName || '—' }}</td>
                      <td class="num">{{ c.calls }}</td>
                      <td class="num">{{ shortToken(c.inputTokens) }}</td>
                      <td class="num">{{ shortToken(c.outputTokens) }}</td>
                      <td class="num"><b>{{ shortToken(c.inputTokens + c.outputTokens) }}</b></td>
                    </tr>
                  </tbody>
                </table>
               </div>
             </div>
           </div>

            <!-- 模型调用权重 -->
            <div class="panel">
              <div class="panel-head">
                <span class="panel-title"><span class="dot-mark"></span>模型调用权重<span class="sub">失败越少优先级越高</span></span>
              </div>
              <div class="panel-body">
                <div v-if="weightLoading" class="page-loading" style="min-height:80px"><div class="spinner"></div>&nbsp;加载中…</div>
                <div v-else-if="weightStats.length === 0" class="model-dist"><div class="empty-tip">暂无渠道数据</div></div>
                <div v-else class="cust-table">
                  <table class="tbl cust-tbl">
                    <thead>
                      <tr>
                        <th style="width:44px">#</th>
                        <th>渠道名</th>
                        <th>模型名</th>
                        <th>失败次数</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-for="(p, i) in weightStats" :key="p.name">
                        <td><span class="cust-rank">{{ i + 1 }}</span></td>
                        <td class="cust-name">{{ p.name }}</td>
                        <td class="num">{{ p.model }}</td>
                        <td class="num" :style="{ color: i < 3 ? 'var(--success)' : 'var(--destructive)' }"><b>{{ p.failCount }}</b></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

         </template>

      </div>
    </div>
  </div>

  <!-- Toast（公共组件） -->
  <x-toast :list="toasts"></x-toast>

</div>

<script src="lib/vue.global.prod.js"></script>
<script src="js/http.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/pages/dashboard.js"></script>
<script>XUi.mount(DashboardApp);</script>
</body>
</html>
