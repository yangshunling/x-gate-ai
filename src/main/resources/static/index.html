<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 · 大模型统一网关</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="main-shell" v-cloak>

  <!-- ==================== 侧栏（全站一致） ==================== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      </div>
      <div class="brand-name">大模型统一网关<small>管理控制台</small></div>
    </div>
    <div class="nav-label">功能导航</div>
    <nav class="menu">
      <a class="menu-item active" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        仪表盘
      </a>
      <a class="menu-item" href="models.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8.3 7.3 15.7 16.7M8.3 4.7h7.4"/><path d="M4.7 8.3v7.4h9"/></svg>
        对客服务
      </a>
      <a class="menu-item" href="services.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="7" rx="2"/><rect x="5" y="14" width="14" height="7" rx="2"/><path d="M9 6.5h.01M9 17.5h.01"/><path d="M12 10v4"/></svg>
        模型服务
      </a>
      <a class="menu-item" href="logs.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M4 12h16M4 18h7"/><circle cx="16.5" cy="6" r="1.8"/><circle cx="20" cy="18" r="1.8"/></svg>
        调用日志
      </a>
    </nav>
    <div class="side-foot">
      <span class="pulse"></span>
      <div>
        <div class="t">服务运行中 <b>ONLINE</b></div>
        <div class="v">/v1 · OpenAI 兼容</div>
      </div>
    </div>
  </aside>

  <!-- ==================== 内容区 ==================== -->
  <div class="content">
    <div class="head">
      <h1><span class="bar"></span>仪表盘</h1>
      <span class="sub">REAL-TIME OVERVIEW</span>
    </div>

    <div class="body">
      <div class="page">

        <!-- 加载中 -->
        <div v-if="dashLoading" class="page-loading">
          <div class="spinner"></div>
          正在读取今日指标…
        </div>

        <template v-else>
          <!-- 指标卡 -->
          <div class="stat-grid">
            <div class="stat" style="--sc: linear-gradient(90deg,#2464ff,#00a3ff)">
              <div class="k">今日调用</div>
              <div class="v">{{ dash.todayCalls != null ? dash.todayCalls : '—' }}</div>
              <div class="u">请求总次数</div>
            </div>
            <div class="stat ok" style="--sc: linear-gradient(90deg,#0faf7a,#2fd6a0)">
              <div class="k">今日成功</div>
              <div class="v">{{ dash.todaySuccess != null ? dash.todaySuccess : '—' }}</div>
              <div class="u">状态码 200~399</div>
            </div>
            <div class="stat bad" style="--sc: linear-gradient(90deg,#ee4a5b,#ff8a5c)">
              <div class="k">今日失败</div>
              <div class="v">{{ dash.todayFail != null ? dash.todayFail : '—' }}</div>
              <div class="u">异常请求</div>
            </div>
            <div class="stat" style="--sc: linear-gradient(90deg,#7c5cff,#b06bff)">
              <div class="k">输入 Token</div>
              <div class="v"><small>{{ fmtTokens(dash.todayInputTokens) }}</small></div>
              <div class="u">提示词消耗</div>
            </div>
            <div class="stat" style="--sc: linear-gradient(90deg,#00b4d8,#2dd4bf)">
              <div class="k">输出 Token</div>
              <div class="v"><small>{{ fmtTokens(dash.todayOutputTokens) }}</small></div>
              <div class="u">生成内容消耗</div>
            </div>
            <div class="stat" style="--sc: linear-gradient(90deg,#0faf7a,#2fd6a0)">
              <div class="k">启用对客服务</div>
              <div class="v">{{ dash.enabledChannels != null ? dash.enabledChannels : '—' }}</div>
              <div class="u">对外暴露的模型</div>
            </div>
            <div class="stat" style="--sc: linear-gradient(90deg,#2464ff,#00a3ff)">
              <div class="k">启用模型服务</div>
              <div class="v">{{ dash.enabledProviders != null ? dash.enabledProviders : '—' }}</div>
              <div class="u">已接入的上游</div>
            </div>
          </div>

          <!-- 快速上手 -->
          <div class="panel">
            <div class="panel-head">
              <span class="panel-title"><span class="dot-mark"></span>快速上手<span class="sub">使用指南</span></span>
            </div>
            <div class="panel-body">
              <div class="hint-grid">
                <div class="hint">
                  <div class="step">1</div>
                  <div>
                    <div class="ht">接入真实模型服务</div>
                    <div class="hd">在「模型服务」中添加大模型服务商，填入 Base URL 与 API Key，可先「测试连通」。</div>
                  </div>
                </div>
                <div class="hint">
                  <div class="step">2</div>
                  <div>
                    <div class="ht">创建对客服务</div>
                    <div class="hd">在「对客服务」中新建一个名称并绑定一个或多个服务，多路自动轮询与故障切换。</div>
                  </div>
                </div>
                <div class="hint">
                  <div class="step">3</div>
                  <div>
                    <div class="ht">客户端接入</div>
                    <div class="hd">调用 <code>POST /v1/chat/completions</code>，model 字段填写对客服务名即可。</div>
                  </div>
                </div>
                <div class="hint">
                  <div class="step">4</div>
                  <div>
                    <div class="ht">查看调用明细</div>
                    <div class="hd">「调用日志」记录每次转发耗时与 Token 用量，本页汇总今日整体概况。</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>

      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-wrap">
    <div v-for="t in toasts" :key="t.id" class="toast" :class="t.type">
      <span class="dot"></span>{{ t.message }}
    </div>
  </div>

</div>

<script src="lib/vue.global.prod.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/dashboard.js"></script>
<script>
Vue.createApp(DashboardApp).mount('#app');
</script>
</body>
</html>
