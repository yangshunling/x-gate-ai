<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠道管理 · 大模型统一网关</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="main-shell" v-cloak>

  <!-- 侧栏（公共组件） -->
  <x-nav active="services"></x-nav>

  <div class="content">
    <!-- 顶栏（公共组件） -->
    <x-head title="渠道管理" sub="上游接入渠道"></x-head>

    <div class="body">
      <div class="page">

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title"><span class="dot-mark"></span>渠道管理<span class="sub">共 {{ providers.length }} 个</span></span>
            <div class="panel-toolbar">
              <button class="btn btn-ghost btn-sm" @click="load">刷新</button>
              <button class="btn btn-primary btn-sm" @click="openModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                新增渠道
              </button>
            </div>
          </div>

          <div class="tbl-wrap">
            <table class="tbl">
              <thead>
                <tr>
                  <th>名称</th><th>Base URL</th><th>模型名</th>
                  <th>状态</th><th>备注</th><th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr v-if="loading"><td colspan="6" class="empty-row"><div class="spinner"></div>&nbsp;加载中…</td></tr>
                <tr v-else-if="providers.length === 0">
                  <td colspan="6" class="empty-row">
                    <div class="empty-state">
                      <span class="es-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="8" rx="2"/><rect x="4" y="13" width="16" height="8" rx="2"/><path d="M9 7h.01M9 17h.01"/></svg>
                      </span>
                      <span class="es-text">暂无渠道，点击右上角<b>「新增渠道」</b>接入</span>
                    </div>
                  </td>
                </tr>
                <tr v-for="p in providers" :key="p.id">
                  <td style="font-weight:600">{{ p.name }}</td>
                  <td><span class="mono ellip" style="display:inline-block;vertical-align:middle" :title="p.baseUrl">{{ p.baseUrl }}</span></td>
                  <td><span class="mono sub">{{ p.modelName }}</span></td>
                  <td>
                    <label class="switch" :title="p.enabled ? '点击停用' : '点击启用'">
                      <input type="checkbox" :checked="p.enabled" @change="toggle(p)">
                      <span class="slider"></span>
                    </label>
                  </td>
                  <td class="sub">{{ p.remark || '—' }}</td>
                  <td>
                    <div class="ops">
                      <button class="btn btn-ghost btn-sm" @click="test(p)">测试连通</button>
                      <a class="row-link" @click="openModal(p)">编辑</a>
                      <span class="sep"></span>
                      <a class="row-link danger" @click="remove(p)">删除</a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ==================== 新增 / 编辑弹窗 ==================== -->
  <div v-if="modal.open" class="modal-mask">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title">{{ modal.editId ? '编辑渠道' : '新增渠道' }}</span>
        <button class="modal-close" @click="closeModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-item">
            <label>名称 <span class="req">*</span></label>
            <input class="input" v-model.trim="modal.form.name" placeholder="如：DeepSeek 官方">
          </div>
          <div class="form-item">
            <label>模型名 <span class="req">*</span> <span class="form-hint">该渠道提供的模型</span></label>
            <input class="input mono-input" v-model.trim="modal.form.modelName" placeholder="如：deepseek-chat">
          </div>
        </div>
        <div class="form-item">
          <label>Base URL <span class="req">*</span> <span class="form-hint">服务地址（含 /v1）</span></label>
          <input class="input mono-input" v-model.trim="modal.form.baseUrl" placeholder="如：https://api.deepseek.com/v1">
        </div>
        <div class="form-item">
          <label>API Key <span class="req" v-if="!modal.editId">*</span>
            <span class="form-hint">{{ modal.editId ? '留空表示不修改，不回显原值' : '该渠道的调用密钥' }}</span>
          </label>
          <input class="input mono-input" type="password" v-model.trim="modal.form.apiKey"
                 :placeholder="modal.editId ? '留空保持不变' : '请输入 API Key'">
        </div>
        <div class="form-grid">
          <div class="form-item">
            <label>状态</label>
            <div class="check-cell">
              <label class="checkbox-line">
                <input type="checkbox" v-model="modal.form.enabled"> <span class="txt">启用该渠道</span>
              </label>
            </div>
          </div>
          <div class="form-item">
            <label>备注</label>
            <input class="input" v-model.trim="modal.form.remark" placeholder="选填">
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" @click="closeModal">取消</button>
        <button class="btn btn-primary" :disabled="modal.saving" @click="save">
          <span v-if="modal.saving" class="spinner"></span>保存
        </button>
      </div>
    </div>
  </div>

  <!-- Toast（公共组件） -->
  <x-toast :list="toasts"></x-toast>

</div>

<script src="lib/vue.global.prod.js"></script>
<script src="js/http.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/pages/services.js"></script>
<script>XUi.mount(ServicesApp);</script>
</body>
</html>
