# ================================================================================
#                                服务基础配置
# ================================================================================
spring.application.name=x-gate-ai
server.port=8080
server.address=0.0.0.0

# ================================================================================
#                                时间编码格式配置
# ================================================================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ================================================================================
#                                SQLite 数据库配置
# ================================================================================
# 数据源：SQLite 本地文件，首次启动自动建库建表
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:./x-gate-ai.db
# SQLite 单写者模型，Hikari 连接池保持单连接避免锁竞争
spring.datasource.hikari.maximum-pool-size=1
# 启动时执行建表脚本（幂等，IF NOT EXISTS）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ================================================================================
#                                MyBatis-Plus 配置
# ================================================================================
mybatis-plus.type-aliases-package=com.xgateai.application.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false

# ================================================================================
#                                   网关配置
# ================================================================================
# 上游调用超时时间（单位：分钟），用于耗时较长的 AI 生成任务
gateway.time-out-of-minutes=3
# 失败上游冷却时间（单位：秒），冷却期内不再分配
gateway.cool-down-seconds=30
# 调用日志保留天数，按天滚动清理
gateway.log-retention-days=30
# 上游 api_key 加密密钥（可通过环境变量覆盖）
gateway.encrypt-key=${XGATE_ENCRYPT_KEY:xgate-ai-encrypt-2026}
# 管理员初始化密码（留空则启动时随机生成并打印到控制台）
gateway.admin-password=${XGATE_ADMIN_PASSWORD:}

# ================================================================================
#                                日志级别配置
# ================================================================================
logging.level.root=info
logging.level.com.zaxxer.hikari=WARN
